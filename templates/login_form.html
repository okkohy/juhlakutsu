{% extends "base.html" %}

{% block title %}Kirjaudu sisään{% endblock %}

{% block content %}
<form action="/login", method="post">
  <p>Käyttäjätunnus</p>
  <input
      type="text"
      name="username"
      placeholder="Käyttäjänimi">
  <p>Salasana</p>
  <input
      type="password"
      name="password"
      placeholder="Salasana">
  <button type="submit">Kirjaudu</button>
</form>
{% endblock %}
