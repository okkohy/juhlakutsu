{% extends "base.html" %}

{% block title %}Juhlakutsut{% endblock %}

{% block content %}
<h2>Juhlakutsut</h2>

<ul class="parties">
  {% for party in parties %}
  <div class="party">
    <a href="/party/{{ party.id }}">{{ party.title }}</a>
    <br />
    Järjestäjä: <a href="/user/{{ item.user_id }}">{{ item.username }}</a>
    <br />
    Vieraiden määrä: {{ party.guest_count }}
  </div>
  {% endfor %}
</ul>
{% endblock %}
