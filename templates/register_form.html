{% extends "base.html" %}

{% block title %}Luo tili{% endblock %}

{% block content %}
<form action="/register" method="post" class="form">
  <p>
  <label for="username">Käyttäjätunnus</label>
  <br>
  <input
      type="text"
      name="username"
      placeholder="Käyttäjänimi"
      required>
  </p>
  <p>
  <label for="displayname">Kutsumanimi</label>
  <br>
  <input
      type="text"
      name="displayname"
      placeholder="Kutsumanimi"
      required>
  </p>
  <p>
  <label for="password">Salasana</label>
  <br>
  <input
      type="password"
      name="password"
      placeholder="Salasana"
      required>
  </p>
  <p>
  <label for="password2">Salasana uudestaan</label>
  <br>
  <input
      type="password"
      name="password2"
      placeholder="Salasana"
      required>
  </p>
  <button type="submit">Luo tili</button>
</form>
{% endblock %}
